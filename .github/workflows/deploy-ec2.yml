name: Deploy official website to EC2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: alemax-official-production
  cancel-in-progress: false
jobs:
  deploy:
    # Configure the repository variable only after the first manual deployment.
    if: github.ref == 'refs/heads/main' && vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Authenticate through AWS OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy exact commit through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          SCRIPT="set -eu
          exec 8>/var/lock/alemax-official-ssm.lock
          flock -n 8
          cd /opt/alemax-official-v2
          test -z \"\$(sudo -H -u ubuntu git status --porcelain --untracked-files=no)\"
          sudo -H -u ubuntu git fetch origin main
          sudo -H -u ubuntu git merge-base --is-ancestor $DEPLOY_SHA origin/main
          sudo -H -u ubuntu git checkout --detach $DEPLOY_SHA
          bash deploy/ec2/deploy.sh
          "
          PARAMETERS=$(jq -n --arg script "$SCRIPT" '{commands: [$script], executionTimeout: ["2400"]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 250); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) echo "Deployment succeeded: $DEPLOY_SHA"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out. Inspect SSM command $COMMAND_ID; it may still be running."
          exit 1
