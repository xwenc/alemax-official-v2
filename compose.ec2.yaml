# Standalone production stack; do not merge with compose.yaml.
name: alemax-official
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alemax
      MYSQL_USER: alemax
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u alemax alemax -e "SELECT
        1"
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://alemax:${MYSQL_PASSWORD}@db:3306/alemax?charset=utf8mb4
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      DEEPL_GLOSSARY_ID: ${DEEPL_GLOSSARY_ID:-}
      UPLOADS_DIR: /app/uploads
      CMS_SEED_ON_START: ${CMS_SEED_ON_START:-true}
    volumes:
    - cms_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    init: true
  worker:
    build: ./backend
    restart: unless-stopped
    command:
    - python
    - -m
    - app.translation
    environment:
      DATABASE_URL: mysql+pymysql://alemax:${MYSQL_PASSWORD}@db:3306/alemax?charset=utf8mb4
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      DEEPL_GLOSSARY_ID: ${DEEPL_GLOSSARY_ID:-}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    init: true
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
    - 127.0.0.1:${WEB_PORT:-3100}:3000
    environment:
      VISIT_STATS_ENABLED: ${VISIT_STATS_ENABLED:-false}
      VISIT_HASH_SECRET: ${VISIT_HASH_SECRET:-}
      API_INTERNAL_URL: http://api:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SITE_ORIGINS: ${SITE_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INQUIRY_TO: ${INQUIRY_TO:-info@alemaxglobal.com}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  mysql_data: null
  cms_uploads: null
