# Production site shares the CRM MySQL server, using a separate database/user.
name: alemax-official
services:
  # Maintenance client only: never starts mysqld or runs during normal `up`.
  db-client:
    image: mysql:8.4
    profiles: [maintenance]
    entrypoint: [mysql]
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_TCP_PORT: '3306'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alemaxsite}
      MYSQL_USER: ${MYSQL_USER:-alemaxsite}
      MYSQL_PWD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.ec2}
    networks: [crm_database]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-alemaxsite}:${MYSQL_PASSWORD}@${MYSQL_HOST:-mysql}:3306/${MYSQL_DATABASE:-alemaxsite}?charset=utf8mb4
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      DEEPL_GLOSSARY_ID: ${DEEPL_GLOSSARY_ID:-}
      UPLOADS_DIR: /app/uploads
      CMS_SEED_ON_START: ${CMS_SEED_ON_START:-false}
    volumes:
    - cms_uploads:/app/uploads
    networks: [default, crm_database]
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    init: true
  worker:
    networks: [default, crm_database]
    build: ./backend
    restart: unless-stopped
    command:
    - python
    - -m
    - app.translation
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-alemaxsite}:${MYSQL_PASSWORD}@${MYSQL_HOST:-mysql}:3306/${MYSQL_DATABASE:-alemaxsite}?charset=utf8mb4
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      DEEPL_GLOSSARY_ID: ${DEEPL_GLOSSARY_ID:-}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    init: true
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
    - 127.0.0.1:${WEB_PORT:-3100}:3000
    environment:
      VISIT_STATS_ENABLED: ${VISIT_STATS_ENABLED:-false}
      VISIT_HASH_SECRET: ${VISIT_HASH_SECRET:-}
      API_INTERNAL_URL: http://api:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SITE_ORIGINS: ${SITE_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INQUIRY_TO: ${INQUIRY_TO:-info@alemaxglobal.com}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  cms_uploads: null
networks:
  default: {}
  crm_database:
    external: true
    name: ${CRM_MYSQL_NETWORK:-alemax_shared}
