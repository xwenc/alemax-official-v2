services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alemax
      MYSQL_USER: alemax
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u alemax alemax -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://alemax:${MYSQL_PASSWORD}@db:3306/alemax?charset=utf8mb4
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SITE_ORIGINS: ${SITE_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INQUIRY_TO: ${INQUIRY_TO:-info@alemaxglobal.com}
    depends_on:
      api:
        condition: service_healthy
volumes:
  mysql_data:
