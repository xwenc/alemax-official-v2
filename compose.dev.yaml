services:
  worker:
    volumes:
      - ./backend/app:/app/app:ro
  api:
    environment:
      ENVIRONMENT: development
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload]
    volumes:
      - ./backend/app:/app/app:ro
  web:
    build:
      context: ./frontend
      target: development
    # The persistent node_modules volume can outlive dependency changes in the image.
    # Synchronize from the bind-mounted lockfile before starting Next.js.
    command: [sh, -c, 'npm ci --no-audit --no-fund && exec npm run dev']
    environment:
      NODE_ENV: development
      ENVIRONMENT: development
      SITE_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
    volumes:
      - ./frontend:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
volumes:
  dev_node_modules:
  dev_next:
